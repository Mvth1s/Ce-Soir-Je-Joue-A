packages:
  - "front"
  - "back"
overrides:
  # GHSA-2v37-7h3g-55p8 (high, corrigee en 3.3.17) : nanoid est une
  # dependance transitive de postcss (via @vue/compiler-sfc, vite),
  # constate le 2026-08-07 sur `pnpm audit --prod --audit-level=high`. Range
  # bornee a la branche 3.x (postcss ne declare pas de compatibilite avec
  # nanoid 4+) : juste le patch qui corrige l'avis, pas de saut de majeure.
  nanoid: ">=3.3.17 <4"
allowBuilds:
  bufferutil: false
  esbuild: true
auditConfig:
  ignoreGhsas:
    - GHSA-fx2h-pf6j-xcff
    - GHSA-67mh-4wv8-2f99
    - GHSA-4w7w-66w2-5vf9
    - GHSA-v6wh-96g9-6wx3
