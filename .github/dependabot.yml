version: 2
updates:
  # Un seul lockfile pnpm (pnpm-lock.yaml) a la racine pour tout le monorepo
  # (front/, back/) : une entree "/" suffit, Dependabot suit les workspaces.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Les mises a jour mineures/correctifs sont groupees en une seule PR
      # hebdomadaire (peu de risque, evite le bruit). Les montees de version
      # majeure restent ouvertes individuellement : elles meritent une revue
      # dediee (breaking changes potentiels).
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TS 7 n'expose pas d'API (prevue en 7.1) : vue-tsc/Volar ne fonctionnent qu'avec TS <= 6.
      # A lever quand vue-tsc supportera TS 7. Garder typescript aligne dans les 3 package.json.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Epingle volontairement (voir scripts/semantic-release/generate-notes.cjs) : la v10 exige
      # conventional-changelog-writer 9, alors que release-notes-generator 14 depend encore du writer 8.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
      # iron-session 9 est ESM-only : les fonctions Vercel (compilees en CommonJS, "type": "commonjs")
      # plantent au chargement en prod (ERR_REQUIRE_ESM), alors que la CI/e2e (tsx) passe. Constate
      # le 2026-10-06 (v1.1.2, rollback). A lever avec un import dynamique dans back/src/session.ts,
      # valide par un vrai login sur une preview Vercel avant toute promotion.
      - dependency-name: "iron-session"
        update-types: ["version-update:semver-major"]

  # Garde aussi les actions utilisees dans .github/workflows/ a jour
  # (actions/checkout, actions/setup-node, github/codeql-action, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
