name: CI

# Vercel deploie deja automatiquement une preview pour chaque push/PR (integration
# Git native, projet deja lie voir .vercel/project.json) : ce workflow ne redeploie
# donc jamais de preview lui-meme, il se contente de verifier (test -> build) avant
# merge, et pilote explicitement deux choses sur push vers main : la publication
# d'une release (job `release`, voir release.config.js) et la promotion en
# production (job `deploy-production`), toutes deux conditionnees a la reussite
# des tests plutot que de partir en parallele des checks GitHub.
#
# `release` (semantic-release) tourne avant `deploy-production` et pousse
# directement sur `main` un commit `chore(release): x.y.z [skip ci]` mettant a
# jour front/public/CHANGELOG.md (voir section "Commits et changelog" de
# CLAUDE.md) : le token GITHUB_TOKEN par defaut ne redeclenche pas ce workflow
# pour ce push (comportement standard des Actions), donc pas de boucle. C'est
# pour recuperer ce commit que `deploy-production` checkoute explicitement
# `main` (et non le SHA qui a declenche ce run) avant de builder.
#
# Pour que ce gate soit reellement respecte, desactiver le deploiement automatique
# de Vercel sur la branche main (Project Settings -> Git -> Ignored Build Step, ou
# equivalent) : voir le recapitulatif de mise en route pour le detail.
#
# Filtrage par chemin (job `changes`, voir CLAUDE.md section "CI : filtrage par
# chemin") : `test`/`build` ne tournent que si le diff touche du code ou de la
# config susceptible d'affecter typecheck/build/tests (front, back, api, db,
# scripts, tests, deps, config). Un changement uniquement `docs` et/ou
# `workflows` saute ces deux jobs (rien a typechecker/tester) ; `workflows`
# declenche a la place `yaml-lint`, qui valide seulement le YAML modifie.
# `deploy-production` n'a pas besoin de condition dediee : comme il depend de
# `build` (needs: build), il se saute automatiquement en cascade si `build`
# a lui-meme ete saute (needs implique success(), jamais vrai pour un job
# skipped) - donc pas de redeploiement pour un push docs/workflows-only vers
# main, ce qui est correct puisque ni l'un ni l'autre n'affecte l'app deployee.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    # Lecture seule, requise par dorny/paths-filter.
    permissions:
      pull-requests: read
    outputs:
      front: ${{ steps.filter.outputs.front }}
      back: ${{ steps.filter.outputs.back }}
      api: ${{ steps.filter.outputs.api }}
      db: ${{ steps.filter.outputs.db }}
      scripts: ${{ steps.filter.outputs.scripts }}
      tests: ${{ steps.filter.outputs.tests }}
      deps: ${{ steps.filter.outputs.deps }}
      config: ${{ steps.filter.outputs.config }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
      # Vrai si le diff touche a quoi que ce soit susceptible de casser
      # typecheck, build ou la suite e2e. Volontairement large : `front` et
      # `back`/`api`/`db` declenchent le meme job complet (typecheck + e2e)
      # faute de suite de tests separable en sous-ensembles plus fins dans cet
      # outillage (un seul `pnpm typecheck`, une seule suite Playwright qui
      # couvre deja front+back ensemble). `scripts` et `tests` sont inclus
      # car scripts/lib/apiServer.ts et tests/e2e/** font partie du harnais de
      # test lui-meme. `docs` et `workflows` sont volontairement absents de
      # cette liste : ni l'un ni l'autre ne peut faire echouer typecheck/
      # build/tests.
      run_full_suite: ${{ steps.filter.outputs.front == 'true' || steps.filter.outputs.back == 'true' || steps.filter.outputs.api == 'true' || steps.filter.outputs.db == 'true' || steps.filter.outputs.scripts == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.deps == 'true' || steps.filter.outputs.config == 'true' }}
    steps:
      # dorny/paths-filter n'utilise l'API GitHub (sans checkout) que sur
      # `pull_request` ; sur `push` il calcule toujours le diff via des
      # commandes git locales et echoue sans depot git present ("fatal: not
      # a git repository") -- constate en prod sur les 3 premiers push vers
      # `dev` apres l'introduction de ce job (echec en ~10s a chaque fois,
      # jusqu'a ce correctif). fetch-depth par defaut suffit : l'action fait
      # elle-meme un fetch iteratif si la profondeur initiale ne suffit pas
      # a trouver la base de comparaison.
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Determiner les categories de fichiers modifies
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            front:
              - 'front/**'
            back:
              - 'back/src/**'
            api:
              - 'api/**'
            db:
              - 'back/src/db/**'
              - '**/schema.sql'
              - 'migrations/**'
            scripts:
              - 'scripts/**'
            tests:
              - 'tests/**'
            deps:
              - 'package.json'
              - 'front/package.json'
              - 'back/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            config:
              - 'tsconfig.base.json'
              - 'playwright.config.ts'
              - 'commitlint.config.js'
              - 'vercel.json'
              - 'lighthouserc.json'
              - 'release.config.js'
            workflows:
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  yaml-lint:
    name: yaml-lint
    needs: changes
    # Seul cas ou ce job tourne : un .yml sous .github/workflows/ a change.
    # Ne remplace pas `test`/`build` : valide juste la syntaxe et les actions
    # utilisees dans le(s) fichier(s) modifie(s), pas le comportement de l'app.
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Valider la syntaxe et les actions des workflows
        uses: reviewdog/action-actionlint@v1
        with:
          # reporter local : affiche les erreurs dans les logs, sans
          # necessiter de permissions supplementaires (pas de commentaire de
          # PR ni de check API a creer).
          reporter: local
          # filter_mode: file (le defaut) tente de restreindre les resultats
          # aux lignes modifiees via un diff, ce que le reporter local ne
          # configure pas ("reviewdog: diff command is empty", constate en
          # CI) : nofilter fait analyser tout le fichier par actionlint sans
          # tenter ce diff, ce qui convient ici (le job ne tourne de toute
          # facon que si un .yml sous .github/workflows/ a change).
          filter_mode: nofilter
          # Le defaut (fail_level: none) ne fait jamais echouer le job meme
          # si actionlint trouve une vraie erreur : sans ca, ce job ne sert
          # a rien.
          fail_level: error

  test:
    name: test
    needs: changes
    # Sans `docs`/`workflows` comme seule categorie modifiee, run_full_suite
    # est vrai et ce job tourne normalement (comportement identique a avant
    # ce filtrage pour tout changement de code).
    if: needs.changes.outputs.run_full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v5

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Verifier les types (front + back + tests)
        run: pnpm typecheck

      - name: Verifier la presence des mentions legales
        run: pnpm exec tsx scripts/check-legal-pages.ts

      - name: Auditer les dependances (vulnerabilites connues)
        # --prod : les CVE actuelles du depot sont toutes des transitives de
        # `vercel` (devDependency, CLI local uniquement - tar/path-to-regexp/
        # minimatch dans son arbre de build), jamais executees par l'app
        # deployee. Auditer aussi les devDependencies ferait echouer la CI
        # sur des paquets hors de notre controle sans rapport avec le
        # risque reel.
        #
        # 4 avis ignores via `pnpm-workspace.yaml` (auditConfig.ignoreGhsas,
        # verifie le 2026-08-06 apres le passage a vue-router 5) : vue-router
        # 5 fusionne unplugin-vue-router (routing par fichiers, non utilise
        # par ce depot, voir front/src/router/index.ts) dans le paquet
        # principal, et declare `vite`/`unplugin` comme ses propres
        # dependances de production - ce qui rend visibles a `--prod` 4 CVE
        # de `vite` (transitif via `vue-router>vite` et
        # `vue-router>unplugin>vite`) qui existaient deja silencieusement
        # dans la devDependency `vite` de `front/package.json` (meme version
        # 5.4.x partout), simplement jamais auditees avant faute de chemin
        # de production vers elles. Les 4 avis sont tous specifiques au
        # serveur de dev Vite et/ou a Windows (bypass `server.fs.deny`,
        # CORS du serveur de dev esbuild, traversee de chemin dans les
        # sourcemaps de deps optimisees en dev, fuite NTLMv2 via UNC sous
        # Windows) : ce depot ne lance que `vite build` (jamais `vite dev`)
        # en CI, sur Linux, pour produire un SPA statique servi tel quel -
        # aucun de ces 4 avis ne s'applique a cet usage. A revalider si le
        # depot se met un jour a executer `vite dev` en CI/production, ou
        # lors d'un futur passage a Vite 6 (qui les corrige justement).
        run: pnpm audit --prod --audit-level=high

      - name: Installer Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: Verifier que la base de test est configuree
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          if [ -z "$DATABASE_URL_TEST" ]; then
            echo "::error::Le secret DATABASE_URL_TEST est manquant. Voir tests/README.md : il faut une branche Neon dediee aux tests E2E."
            exit 1
          fi

      - name: Lancer les tests end-to-end (Playwright)
        run: pnpm test:e2e
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Notifier Discord en cas d'echec
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: "CI : le job test a echoue"
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-discord.sh "$MESSAGE" "$REF_NAME" "$RUN_URL"

  build:
    name: build
    needs: [changes, test]
    # Explicite plutot que de compter uniquement sur la cascade `needs: test`
    # (un job skipped ne satisfait pas le success() implicite de `needs`,
    # donc `build` se sauterait de toute facon) : plus lisible d'avoir la
    # meme condition que `test` ecrite ici directement.
    if: needs.changes.outputs.run_full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v5

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Construire le front
        run: pnpm build

      - name: Notifier Discord en cas d'echec
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: "CI : le job build a echoue"
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-discord.sh "$MESSAGE" "$REF_NAME" "$RUN_URL"

  release:
    name: release
    needs: [changes, test]
    # Meme condition explicite que `build` (voir son commentaire) : semantic-release
    # ne publie de toute facon que sur `main` (voir release.config.js), mais on
    # evite de le lancer pour rien sur un diff docs/workflows-only.
    if: needs.changes.outputs.run_full_suite == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # contents: write pour le tag + le commit chore(release) pousses par
    # @semantic-release/git (voir release.config.js) ; issues/pull-requests:
    # write pour que @semantic-release/github puisse creer la GitHub Release
    # (successComment/failComment desactives dans release.config.js, donc pas
    # besoin d'aller plus loin que ca).
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          # semantic-release a besoin de tout l'historique (et des tags) pour
          # determiner le dernier release et les commits a analyser depuis.
          fetch-depth: 0

      - name: Installer pnpm
        uses: pnpm/action-setup@v5

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Publier une release (tag, GitHub Release, CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Notifier Discord en cas d'echec
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: "CI : le job release a echoue"
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-discord.sh "$MESSAGE" "$REF_NAME" "$RUN_URL"

  deploy-production:
    name: deploy-production
    needs: [build, release]
    # Pas de condition liee au filtrage par chemin ici : `needs: [build, release]`
    # suffit. Si `build` et `release` ont ete sautes (push docs/workflows-only
    # vers main), ce job se saute automatiquement avec eux (needs exige
    # success(), jamais vrai pour un job skipped) - comportement voulu, voir
    # le commentaire en tete de fichier.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          # ref: main (et non le SHA qui a declenche ce run) : le job `release`
          # a pousse un commit chore(release) sur main juste avant (voir
          # needs ci-dessus), qui met a jour front/public/CHANGELOG.md - on
          # veut deployer avec ce commit inclus, pas celui d'avant.
          ref: main

      - name: Installer pnpm
        uses: pnpm/action-setup@v5

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Verifier que les secrets Vercel sont configures
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) manquant(s) pour le deploiement :$missing"
            exit 1
          fi

      - name: Installer le CLI Vercel
        run: npm install --global vercel@latest

      - name: Construire pour la production (Vercel)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deployer en production
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test post-deploiement
        env:
          # Volontairement PAS steps.deploy.outputs.url : c'est l'URL de
          # deploiement ephemere (ex. ce-soir-je-joue-a9rj0eshe-....vercel.app),
          # protegee par defaut par la Vercel Deployment Protection (redirige
          # en 302 vers vercel.com/sso-api), y compris pour les deploiements
          # de production. Le domaine custom ci-dessous n'a pas cette
          # protection et est celui reellement expose au public.
          DEPLOY_URL: https://cesoirjejouea.vercel.app
        run: .github/scripts/smoke-test.sh "$DEPLOY_URL"

      - name: Notifier Discord en cas d'echec (deploiement ou smoke test)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: "Production : le deploiement ou le smoke test a echoue (voir docs/04-deploiement-et-rollback.md)"
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-discord.sh "$MESSAGE" "$REF_NAME" "$RUN_URL"
