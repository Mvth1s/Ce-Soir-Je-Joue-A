    <rect x="24" y="82" width="12" height="12" rx="1.5" fill="#3A3A4A" stroke="#EDEDF3" stroke-opacity="0.22" stroke-width="1.4"></rect>
    <rect id="dpad-lit" x="38" y="68" width="12" height="12" rx="1.5" fill="#3FD9C3"></rect>
  </g>
  <g id="ligne-de-visee">
