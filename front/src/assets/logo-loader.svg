<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    #dpad-lit { animation: dpad-pulse 1.4s ease-in-out infinite; transform-origin: 44px 74px; }
    @keyframes dpad-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    #sight-line { animation: sight-march 1.1s linear infinite; }
    @keyframes sight-march { to { stroke-dashoffset: -11; } }
  </style>

  <g id="dpad">
    <rect x="24" y="54" width="12" height="12" rx="1.5" fill="#3A3A4A" stroke="#EDEDF3" stroke-opacity="0.22" stroke-width="1.4"></rect>
    <rect x="10" y="68" width="12" height="12" rx="1.5" fill="#3A3A4A" stroke="#EDEDF3" stroke-opacity="0.22" stroke-width="1.4"></rect>
